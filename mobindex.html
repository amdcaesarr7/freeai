<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaesarrSLLM - Powered by Puter</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
    <script src="config.js"></script>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <!-- Stars -->
    <div class="stars" id="stars"></div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
            overflow-x: hidden;
        }

        /* Animated Gradient Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(-45deg, #000000, #1a0033, #330066, #0d0d2b, #1a1a3e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .orb1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ffffff 0%, rgba(255, 255, 255, 0.5) 40%, transparent 10%);
            top: -100px;
            left: -100px;
            animation: randomFloat1 28s ease-in-out infinite;
            animation-delay: 0s;
        }

        .orb2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #f0f0f0 0%, rgba(240, 240, 240, 0.4) 40%, transparent 10%);
            bottom: -150px;
            right: -150px;
            animation: randomFloat2 35s ease-in-out infinite;
            animation-delay: -7s;
        }

        .orb3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #e8e8ff 0%, rgba(232, 232, 255, 0.3) 40%, transparent 10%);
            top: 50%;
            left: 50%;
            animation: randomFloat3 32s ease-in-out infinite;
            animation-delay: -14s;
        }

.orb3.light-theme {
    background: radial-gradient(circle, #9b4a8c 100%, transparent 0%);
    animation: randomFloat3 32s ease-in-out infinite;
}

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, -100px) scale(1.1);
            }
            66% {
                transform: translate(-100px, 100px) scale(0.9);
            }
        }

        @keyframes randomFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -60px) scale(1.1); }
            50% { transform: translate(-30px, 40px) scale(0.95); }
            75% { transform: translate(50px, 30px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes randomFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-50px, 50px) scale(1.05); }
            50% { transform: translate(40px, -40px) scale(0.98); }
            75% { transform: translate(-30px, -60px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes randomFloat3 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(35px, 45px) scale(1.08); }
            50% { transform: translate(-45px, -35px) scale(1); }
            75% { transform: translate(45px, -50px) scale(0.96); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        body.dark-theme .stars {
            color:black;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 30px rgba(102, 126, 234, 0.3), 0 8px 32px 0 rgba(102, 126, 234, 0.35), 0 0 100px rgba(255, 255, 255, 0.2);
            animation: darkContainerGlow 4s ease-in-out infinite;
        }

        @keyframes darkContainerGlow {
            0%, 100% { box-shadow: inset 0 0 30px rgba(102, 126, 234, 0.3), 0 8px 32px 0 rgba(102, 126, 234, 0.35), 0 0 100px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: inset 0 0 50px rgba(102, 126, 234, 0.4), 0 12px 40px 0 rgba(102, 126, 234, 0.45), 0 0 120px rgba(255, 255, 255, 0.3); }
        }

        .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: 60px;
        }

        .header-icon {
            font-size: 20px;
            color: #667eea;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .header-text {
            flex: 1;
            min-width: 0;
        }

        .header-text h1 {
            font-size: 18px;
            color: #333;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-text p {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            margin: 4px 0 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark-theme .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .header-text h1 {
            color: #fff;
        }

        body.dark-theme .header-text p {
            color: #9ba3ff;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-height: 0;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        body.dark-theme .chat-area {
            background: rgba(20, 20, 30, 0.5);
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
            gap: 8px;
        }

        .message.user {
            justify-content: flex-end;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 15px;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            font-size: 14px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 5px 15px 15px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .message.ai .message-bubble {
            background: rgba(240, 240, 240, 0.95);
            color: #333;
            border-radius: 5px 15px 15px 15px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
        }

        body.dark-theme .message.ai .message-bubble {
            background: rgba(30, 30, 45, 0.85);
            color: #e0e0e0;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .input-area {
            padding: 12px;
            border-top: 1px solid rgba(102, 126, 234, 0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            flex-shrink: 0;
        }

        body.dark-theme .input-area {
            background: rgba(20, 20, 35, 0.6);
            border-top-color: rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(15px);
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            min-height: 40px;
            max-height: 120px;
            resize: none;
        }

        input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        body.dark-theme input {
            background: rgba(50, 50, 65, 0.9);
            color: #e0e0e0;
            border-color: rgba(102, 126, 234, 0.5);
        }

        body.dark-theme input::placeholder {
            color: #888;
        }

        body.dark-theme input:focus {
            background: rgba(60, 60, 80, 0.95);
            border-color: #667eea;
        }

        button {
            padding: 10px 16px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            flex-shrink: 0;
        }

        button:active {
            transform: scale(0.95);
        }

        .upload-btn {
            padding: 10px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            min-width: 40px;
        }

        .upload-btn:active {
            background: rgba(102, 126, 234, 0.3);
        }

        #sendBtn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            padding: 0;
            border-radius: 50%;
        }

        .chat-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .settings-btn, .dark-theme-btn {
            padding: 8px;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
        }

        body.dark-theme .settings-btn,
        body.dark-theme .dark-theme-btn {
            background: rgba(102, 126, 234, 0.2);
            color: #aabbff;
        }

        body.dark-theme .dark-theme-btn {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .model-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .model-dropdown-btn {
            padding: 8px 12px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            background: white;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
        }

        body.dark-theme .model-dropdown-btn {
            background: rgba(50, 50, 65, 0.9);
            color: #e0e0e0;
            border-color: rgba(102, 126, 234, 0.4);
        }

        .model-dropdown {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            background: white;
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: none;
            max-height: 60vh;
            overflow-y: auto;
        }

        .model-dropdown.open {
            display: block;
        }

        body.dark-theme .model-dropdown {
            background: rgba(30, 30, 40, 0.95);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .model-option {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-option:last-child {
            border-bottom: none;
        }

        .model-option:active {
            background: rgba(102, 126, 234, 0.1);
        }

        .model-option.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            color: #667eea;
            font-weight: 600;
        }

        body.dark-theme .model-option {
            background: rgba(50, 50, 65, 0.9);
            color: #e0e0e0;
            border-bottom-color: rgba(102, 126, 234, 0.1);
        }

        body.dark-theme .model-option.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
        }

        .model-option-label {
            display: flex;
            flex-direction: column;
        }

        .model-option-name {
            font-weight: 500;
            font-size: 13px;
        }

        .model-option-type {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        /* Chat History Sidebar - Mobile optimized */
        #chatHistorySidebar {
            position: fixed;
            left: -100%;
            top: 0;
            width: 80%;
            max-width: 300px;
            height: 100vh;
            background: rgba(250, 250, 252, 0.98);
            border-right: 1px solid rgba(102, 126, 234, 0.2);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: left 0.3s ease;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.2);
        }

        #chatHistorySidebar.active {
            left: 0;
        }

        body.dark-theme #chatHistorySidebar {
            background: rgba(25, 25, 35, 0.98);
            border-right-color: rgba(102, 126, 234, 0.3);
        }

        .sidebar-header {
            padding: 16px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-bottom: 1px solid rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        body.dark-theme .sidebar-header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-bottom-color: rgba(102, 126, 234, 0.3);
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            flex: 1;
        }

        body.dark-theme .sidebar-title {
            color: #e0e0e0;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            padding: 12px;
            background: white;
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
        }

        .chat-item:active {
            background: rgba(102, 126, 234, 0.05);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .chat-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            border-color: rgba(102, 126, 234, 0.4);
            font-weight: 500;
        }

        body.dark-theme .chat-item {
            background: rgba(50, 50, 70, 0.8);
            border-color: rgba(102, 126, 234, 0.25);
            color: #d0d0d0;
        }

        body.dark-theme .chat-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: rgba(102, 126, 234, 0.5);
            color: #ffffff;
        }

        .chat-item-label {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffffc6;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            font-weight: 500;
        }

        body.dark-theme .chat-item-label {
            color: #d0d0d0;
        }

.sidebar-footer
 {
    padding: 12px;
    border-top: 1px solid rgba(102, 126, 234, 0.15);
    display: flex;
    gap: 8px;
    flex-direction: column;
    flex-shrink: 0;
    background: rgba(102, 126, 234, 0.02);
    padding-bottom: 6vh;
}

        body.dark-theme .sidebar-footer {
            background: rgba(102, 126, 234, 0.1);
            border-top-color: rgba(102, 126, 234, 0.3);
        }

        .sidebar-new-chat {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Mobile sidebar toggle button */
        .chat-history-toggle {
            position: fixed;
            bottom: 80px;
            left: 12px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            z-index: 999;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-history-toggle:active {
            transform: scale(0.95);
        }

        /* Overlay when sidebar is open */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        #imageInput {
            display: none;
        }

        .image-preview {
            max-width: 150px;
            max-height: 150px;
            margin-top: 8px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .image-container {
            position: relative;
            display: inline-block;
        }

        .remove-image-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 10px;
        }

        /* Settings Panel - Mobile optimized */
        .settings-page {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        body.dark-theme .settings-page {
            background: rgba(30, 30, 40, 0.95);
        }

        .settings-header {
            padding: 16px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-bottom: 1px solid rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-shrink: 0;
        }

        body.dark-theme .settings-header {

<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Mobile Sidebar Toggle Button -->
    <button class="chat-history-toggle" id="sidebarToggle">
        <i class="fas fa-history"></i>
    </button>

    <div class="container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-brain"></i></div>
            <div class="header-text">
                <h1>CaesarrSLLM</h1>
                <p id="chatTitle">New Chat</p>
            </div>
            <div class="chat-controls">
                <button class="settings-btn" id="settingsBtn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="dark-theme-btn" id="themeToggleBtn" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="chat-container">
                <div class="chat-area" id="chatArea"></div>

                <div class="input-area">
                    <div class="model-selector">
                        <button class="model-dropdown-btn" id="modelDropdownBtn">
                            <i class="fas fa-robot"></i>
                            <span id="selectedModelName">GPT-5 Nano</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="model-dropdown" id="modelDropdown"></div>

                    <div id="imagePreviewContainer"></div>

                    <div class="input-group">
                        <button class="upload-btn" id="uploadBtn" title="Upload image">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="imageInput" accept="image/*">
                        <input type="text" id="userInput" placeholder="Ask me anything...">
                        <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Chat History Sidebar (Desktop: visible, Mobile: slide-in) -->
            <div id="chatHistorySidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">Chat History</div>
                    <button class="sidebar-delete-all" id="sidebarDeleteAll" style="display: none;">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                    <button class="sidebar-delete-all" id="sidebarCloseBtn" style="display: block;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="sidebar-content" id="sidebarContent"></div>
                <div class="sidebar-footer">
                    <button class="sidebar-new-chat" id="sidebarNewChat">
                        <i class="fas fa-plus"></i> New Chat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-page" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-settings-btn" id="closeSettingsBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="settings-content">
            <div class="settings-section">
                <h3>Current Chat Info</h3>
                <div class="settings-info-item">
                    <label>Model</label>
                    <div id="panelCurrentModel" class="settings-info-value">GPT-5 Nano</div>
                </div>
                <div class="settings-info-item">
                    <label>Messages</label>
                    <div id="panelMessageCount" class="settings-info-value">0</div>
                </div>
                <div class="settings-info-item">
                    <label>Topic</label>
                    <div id="panelChatTopic" class="settings-info-value">New Conversation</div>
                </div>
            </div>
            <div class="settings-section">
                <h3>Danger Zone</h3>
                <button class="delete-chat-settings-btn" id="deleteChatSettingsBtn">
                    <i class="fas fa-trash"></i> Delete Current Chat
                </button>
            </div>
        </div>
    </div>

    <script src="mscript.js"></script>
    <script>
        // Mobile sidebar overlay toggle
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const chatHistorySidebar = document.getElementById('chatHistorySidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

        function toggleSidebar() {
            chatHistorySidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        }

        function closeSidebarMobile() {
            chatHistorySidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }

        if (sidebarCloseBtn) {
            sidebarCloseBtn.addEventListener('click', closeSidebarMobile);
        }

        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebarMobile);
        }

        // Close sidebar when chat is selected on mobile
        const originalLoadChat = window.loadChat;
        if (typeof originalLoadChat === 'function') {
            window.loadChat = function(...args) {
                originalLoadChat.apply(this, args);
                if (window.innerWidth <= 768) {
                    closeSidebarMobile();
                }
            };
        }

        // Generate stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Parallax effect on scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const orbs = document.querySelectorAll('.orb');
            
            orbs.forEach((orb, index) => {
                orb.style.transform = `translate(${scrolled * 0.1 * (index + 1)}px, ${scrolled * 0.05 * (index + 1)}px)`;
            });
        });

        // Force dark theme - no theme toggle
        document.body.classList.add('dark-theme');
    </script>
